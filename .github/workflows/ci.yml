name: Validate OpenViscera
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=openviscera --cov-fail-under=90 --cov-report=term-missing --cov-report=json:validation/coverage.json --junitxml=validation/tests.xml
      - run: python -m compileall -q src
      - run: for file in src/openviscera/static/*.js; do node --check "$file"; done
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-py${{ matrix.python }}
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-py${{ matrix.python }}
          path: validation/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: OV_BROWSER_TEST=1 OV_SCREENSHOT_DIR=browser-artifacts pytest tests/test_browser.py tests/test_v3_browser.py tests/test_auth_browser.py --junitxml=browser-artifacts/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-workflow
          path: browser-artifacts/
