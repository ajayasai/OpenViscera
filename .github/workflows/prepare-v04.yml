name: Prepare tested v0.4 source
on:
  push:
    branches: ['upgrade/v0.4-authentication']
    paths: ['.upgrade-v04/**']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ajayasai/OpenViscera' && github.ref == 'refs/heads/upgrade/v0.4-authentication'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and apply the locally validated source patch
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == 'cad53c31e512285267b762de67ddc61a1c080f92', 'Unexpected base commit'
          parts = [pathlib.Path(f'.upgrade-v04/part-{i}.txt').read_text() for i in range(6)]
          packed = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '2aed269a46ca965f3d437800915f7904b563df56153a696d52933dade584246b'
          patch = lzma.decompress(packed)
          assert len(patch) == 154180
          assert hashlib.sha256(patch).hexdigest() == 'fc41da35a1fc39a0ae10fc56002824650aa1f4703e6c85e3ddca9c126bd3bbe7'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'v04.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          files = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert len(files) == 28
          assert not any(p.startswith('.github/') or p.startswith('.upgrade-v04/') for p in files)
          pathlib.Path('validation').mkdir(exist_ok=True)
          hashes = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}
          pathlib.Path('validation/source-hashes.json').write_text(json.dumps(hashes, indent=2))
          PY
      - run: python -m pip install -e '.[dev]'
      - run: pytest --cov=openviscera --cov-fail-under=90 --cov-report=term-missing --cov-report=json:validation/coverage.json --junitxml=validation/tests.xml
      - run: python -m compileall -q src
      - run: for file in src/openviscera/static/*.js; do node --check "$file"; done
      - run: python -m build
      - run: python -m playwright install --with-deps chromium
      - run: OV_BROWSER_TEST=1 OV_SCREENSHOT_DIR=browser-artifacts pytest tests/test_browser.py tests/test_v3_browser.py tests/test_auth_browser.py --junitxml=validation/browser.xml
      - name: Commit only verified source to the upgrade branch
        run: |
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement verified v0.4 MFA, account recovery and signed sessions'
          git push origin HEAD:upgrade/v0.4-authentication
          git rev-parse HEAD > validation/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v04-preparation
          path: |
            validation/
            dist/
            browser-artifacts/
