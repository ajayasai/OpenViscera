[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openviscera"
version = "0.1.0"
description = "Forensic specimen dispatch, custody reconciliation and pending-opinion workbench"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "OpenViscera contributors"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "cryptography>=44,<52", "reportlab>=4.3,<5", "qrcode>=8,<9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2", "playwright>=1.50,<2"]

[project.scripts]
openviscera = "openviscera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openviscera = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
